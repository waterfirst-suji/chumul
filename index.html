<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TranslateGemma - 실시간 음성 번역</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>TranslateGemma</h1>
            <p class="subtitle">Gemma 3 기반 실시간 음성 번역</p>
        </header>

        <div class="settings">
            <div class="language-select">
                <div class="select-group">
                    <label for="sourceLang">입력 언어</label>
                    <select id="sourceLang">
                        <option value="ko">한국어</option>
                        <option value="en">English</option>
                        <option value="ja">日本語</option>
                        <option value="zh">中文</option>
                        <option value="es">Español</option>
                        <option value="fr">Français</option>
                        <option value="de">Deutsch</option>
                        <option value="pt">Português</option>
                        <option value="ru">Русский</option>
                        <option value="ar">العربية</option>
                        <option value="hi">हिन्दी</option>
                        <option value="vi">Tiếng Việt</option>
                        <option value="th">ไทย</option>
                        <option value="id">Bahasa Indonesia</option>
                    </select>
                </div>

                <button id="swapLang" class="swap-btn" title="언어 교환">⇄</button>

                <div class="select-group">
                    <label for="targetLang">출력 언어</label>
                    <select id="targetLang">
                        <option value="en">English</option>
                        <option value="ko">한국어</option>
                        <option value="ja">日本語</option>
                        <option value="zh">中文</option>
                        <option value="es">Español</option>
                        <option value="fr">Français</option>
                        <option value="de">Deutsch</option>
                        <option value="pt">Português</option>
                        <option value="ru">Русский</option>
                        <option value="ar">العربية</option>
                        <option value="hi">हिन्दी</option>
                        <option value="vi">Tiếng Việt</option>
                        <option value="th">ไทย</option>
                        <option value="id">Bahasa Indonesia</option>
                    </select>
                </div>
            </div>

            <div class="api-settings">
                <label for="apiKey">Hugging Face API Key</label>
                <input type="password" id="apiKey" placeholder="hf_xxxxxxxxxxxx">
                <small>무료 API 키: <a href="https://huggingface.co/settings/tokens" target="_blank">huggingface.co/settings/tokens</a></small>
            </div>
        </div>

        <div class="translation-area">
            <div class="panel source-panel">
                <div class="panel-header">
                    <span id="sourceLabel">한국어 (음성 입력)</span>
                    <button id="clearSource" class="clear-btn">지우기</button>
                </div>
                <div class="text-content" id="sourceText">
                    <p class="placeholder">마이크 버튼을 눌러 말하세요...</p>
                </div>
            </div>

            <div class="panel target-panel">
                <div class="panel-header">
                    <span id="targetLabel">English (번역)</span>
                    <button id="copyTarget" class="copy-btn">복사</button>
                </div>
                <div class="text-content" id="targetText">
                    <p class="placeholder">번역 결과가 여기에 표시됩니다...</p>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="micBtn" class="mic-btn">
                <svg class="mic-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>
                <span>말하기</span>
            </button>
        </div>

        <div id="status" class="status"></div>

        <footer>
            <p>TranslateGemma - Google의 Gemma 3 기반 오픈소스 번역 모델</p>
            <p class="tech-info">55개 언어 지원 | Web Speech API + Hugging Face Inference API</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
